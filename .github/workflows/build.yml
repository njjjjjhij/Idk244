name: Build WMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WMenu-Android
          path: ${{ steps.build.outputs.build-output }}
