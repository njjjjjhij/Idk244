
name: WMenu Android Build v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build WMenu for Android
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Find Geode files
        run: |
          find . -type f -name "*.geode" -print

      - name: Upload Geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMenu-Android-v2-${{ github.run_number }}
          path: "**/*.geode"
          if-no-files-found: error
          retention-days: 7
